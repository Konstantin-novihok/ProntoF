name: ProntoF and Home Master checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile both backend codebases
        run: |
          python -m compileall -q server home-master/server
      - name: Import Home Master API and verify video routes
        run: |
          python -m pip install -r home-master/server/requirements.txt
          mkdir -p "$RUNNER_TEMP/hm-smoke"
          DATA_DIR="$RUNNER_TEMP/hm-smoke" WEB_DIR="$GITHUB_WORKSPACE/home-master/web" SECRET_KEY="ci-smoke-secret-key-012345678901234567890123456789" OWNER_PASSWORD="ci-smoke-password" PYTHONPATH="$GITHUB_WORKSPACE/home-master/server" python - <<'PY'
          import server
          paths = set(server.app.openapi()["paths"])
          mounted = {getattr(route, "path", None) for route in server.app.routes}
          assert "/app" in mounted
          assert "/orders/{oid}/video-processing/uploads/{upload_id}" in paths
          assert "/orders/{oid}/video-processing/uploads/{upload_id}/chunks/{index}" in paths  # backward compatibility
          assert "/orders/{oid}/video-processing" in paths
          assert "/orders/{oid}/video-processing/from-job/{job_id}" in paths
          assert "/orders/{oid}/video-processing/from-media/{mid}" in paths
          assert "/orders/{oid}/video-processing/{job_id}/source" in paths
          assert "/orders/{oid}/video-processing/{job_id}/render" in paths
          assert "/orders/{oid}/video-processing/{job_id}/render/preview" in paths
          assert "/orders/{oid}/video-processing/{job_id}/render/download" in paths
          assert "/orders/{oid}/video-processing/{job_id}/render/ack" in paths
          assert "/storage/files" in paths
          assert "/orders/{oid}/participants" in paths
          assert "/orders/{oid}/participants/{uid}" in paths
          assert "/orders/{oid}/self-claim" in paths
          assert "/orders/create-as-executor" in paths
          assert "/orders/{oid}/reports" in paths
          assert "/orders/{oid}/reports/me" in paths
          assert "/orders/{oid}/reports/me/files" in paths
          assert "/me/capabilities" in paths
          assert "/warehouse/reservations" in paths
          assert "/warehouse/reservations/{rid}/confirm-payment" in paths
          assert "/warehouse/reservations/{rid}/issue" in paths
          assert "/warehouse/reservations/settings/period" in paths
          assert "/warehouse/reservations/{rid}/expiry" in paths
          assert "/trusted-users/{uid}/capabilities" in paths
          tables = set(server.Base.metadata.tables)
          assert {"order_participants", "executor_reports", "trusted_capabilities", "wh_reservations", "wh_reservation_issues"} <= tables
          from warehouse import Item
          assert {"manufacturer", "package_volume", "package_unit"} <= set(Item.__table__.columns.keys())
          print("Home Master API imports and collaboration/reservation routes are registered.")
          PY
      - name: Exercise collaborative orders, reports, file storage and warehouse reservations
        run: |
          mkdir -p "$RUNNER_TEMP/hm-integration"
          DATA_DIR="$RUNNER_TEMP/hm-integration" WEB_DIR="$GITHUB_WORKSPACE/home-master/web" SECRET_KEY="ci-integration-secret-key-012345678901234567890123456789" OWNER_PASSWORD="ci-integration-password" PYTHONPATH="$GITHUB_WORKSPACE/home-master/server" python - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          import server
          from warehouse import Item, Stock
          from collaboration import OrderParticipant

          with TestClient(server.app) as client:
              with server.SessionLocal() as db:
                  owner = db.scalar(server.select(server.User).where(server.User.role == server.OWNER))
                  e1 = server.User(username="executor_one", password_hash=server.hash_password("executor-password"), role=server.EXECUTOR, full_name="Executor One", rate_type="hourly", rate_value=15)
                  e2 = server.User(username="executor_two", password_hash=server.hash_password("executor-password"), role=server.EXECUTOR, full_name="Executor Two", rate_type="hourly", rate_value=20)
                  customer = server.User(username="customer_one", password_hash=server.hash_password("customer-password"), role=server.CLIENT, full_name="Customer One")
                  db.add_all([e1, e2, customer])
                  db.flush()
                  tokens = {"owner":server.make_token(owner),"e1":server.make_token(e1),"e2":server.make_token(e2),"customer":server.make_token(customer)}
                  item = Item(name="CI Filter", sku="CI-001", manufacturer="CI", unit="pcs", unit_cost=5, created_by=owner.id)
                  db.add(item)
                  db.flush()
                  stock = Stock(item_id=item.id, holder_user_id=None, qty=10)
                  db.add(stock)
                  ids = {"owner":owner.id,"e1":e1.id,"e2":e2.id,"customer":customer.id,"item":item.id}
                  db.commit()

              def headers(key):
                  return {"Authorization":"Bearer "+tokens[key]}

              created = client.post("/orders/create-as-executor",headers=headers("e1"),json={"title":"CI shared order","description":"integration test","address":"Test address"})
              assert created.status_code == 200, created.text
              oid = created.json()["id"]
              assert client.get("/orders",headers=headers("e2")).status_code == 200
              assigned = client.post(f"/orders/{oid}/participants",headers=headers("owner"),json={"executor_id":ids["e2"]})
              assert assigned.status_code == 200, assigned.text
              assert (Path(server.ORDER_DATA_DIR) / "orders" / str(oid) / "history").is_dir()
              user_index = Path(server.DATA_DIR) / "users" / f"{ids['e2']}_executor_two" / "orders" / f"{oid}.json"
              assert user_index.is_file(), str(user_index)
              doc_upload = client.post("/me/documents",headers=headers("e2"),files={"file":("identity.pdf",b"%PDF-1.4\\nCI document","application/pdf")})
              assert doc_upload.status_code == 200, doc_upload.text
              with server.SessionLocal() as db:
                  doc = db.get(server.UserDoc, doc_upload.json()["id"])
                  assert doc and doc.filename.startswith(f"users/{ids['e2']}_executor_two/documents/")
                  assert (Path(server.DATA_DIR) / doc.filename).is_file()

              reservation = client.post("/warehouse/reservations",headers=headers("e2"),json={"item_id":ids["item"],"order_id":oid,"qty":4})
              assert reservation.status_code == 200, reservation.text
              rid = reservation.json()["id"]
              private_view = client.get("/warehouse/reservations",headers=headers("e2")).json()
              assert private_view and "reserved_by" not in private_view[0]
              public_stock = client.get("/warehouse/items",headers=headers("customer")).json()
              ci_item = next(x for x in public_stock if x["id"] == ids["item"])
              assert ci_item["reserved"] == 4 and ci_item["available"] == 6
              paid = client.post(f"/warehouse/reservations/{rid}/confirm-payment",headers=headers("owner"),json={})
              assert paid.status_code == 200 and paid.json()["paid"] and paid.json()["expires_at"] is None

              upload = client.post(f"/orders/{oid}/reports/me/files",headers=headers("e2"),files={"file":("evidence.txt",b"report evidence","text/plain")})
              assert upload.status_code == 200, upload.text
              report = client.put(f"/orders/{oid}/reports/me",headers=headers("e2"),json={
                  "work_done":"Replaced filter","comments":"Completed","materials":[{"name":"CI Filter","qty":2,"unit":"pcs","unit_cost":5,"reservation_id":rid}],
                  "labor_hours":1.5,"other_cost":3,"submit":True})
              assert report.status_code == 200, report.text
              assert report.json()["files"]
              file_id = report.json()["files"][0]["id"]
              assert client.get(f"/files/{file_id}",headers=headers("e2")).status_code == 200
              assert client.get(f"/files/{file_id}",headers=headers("e1")).status_code == 403

              # The report issues the reserved quantity from central stock and creates one material expense.
              with server.SessionLocal() as db:
                  from collaboration import Reservation, ReservationIssue
                  stock_row = db.scalar(server.select(Stock).where(Stock.item_id == ids["item"], Stock.holder_user_id.is_(None)))
                  reserve_row = db.get(Reservation, rid)
                  assert stock_row and stock_row.qty == 8
                  assert reserve_row and reserve_row.status == "active"
                  assert abs(sum(x.qty for x in db.scalars(server.select(ReservationIssue).where(ReservationIssue.reservation_id == rid))) - 2) < 0.001
              issued = client.post(f"/warehouse/reservations/{rid}/issue",headers=headers("e2"),json={"qty":2})
              assert issued.status_code == 200, issued.text
              assert issued.json()["status"] == "consumed" and issued.json()["remaining_qty"] == 0
              with server.SessionLocal() as db:
                  stock_row = db.scalar(server.select(Stock).where(Stock.item_id == ids["item"], Stock.holder_user_id.is_(None)))
                  reserve_row = db.get(Reservation, rid)
                  assert stock_row and stock_row.qty == 6
                  assert reserve_row and reserve_row.status == "consumed"
              public_stock = client.get("/warehouse/items",headers=headers("customer")).json()
              ci_item = next(x for x in public_stock if x["id"] == ids["item"])
              assert ci_item["reserved"] == 0 and ci_item["available"] == 6

              priced = client.post(f"/orders/{oid}/finance",headers=headers("owner"),json={"price":100})
              assert priced.status_code == 200, priced.text
              done = client.post(f"/orders/{oid}/status",headers=headers("owner"),json={"status":"done"})
              assert done.status_code == 200, done.text
              settled = client.post(f"/orders/{oid}/settle",headers=headers("owner"),json={})
              assert settled.status_code == 200, settled.text
              assert abs(settled.json()["cost_price"] - 53) < 0.01, settled.json()
              print("Collaboration, private report files, warehouse reservation and multi-executor costing passed.")
          PY
      - name: Import video worker and render a short Ukrainian MP4 with Piper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r server/requirements.txt
          mkdir -p "$RUNNER_TEMP/prontof-worker-smoke" "$RUNNER_TEMP/prontof-piper-voices"
          DATA_DIR="$RUNNER_TEMP/prontof-worker-smoke" PIPER_VOICE_DIR="$RUNNER_TEMP/prontof-piper-voices" SECRET_KEY="ci-worker-secret-key-012345678901234567890123456789" OWNER_PASSWORD="ci-worker-password" PYTHONPATH="$GITHUB_WORKSPACE/server" python - <<'PY'
          import json, subprocess, uuid
          from pathlib import Path
          import app
          paths = set(app.app.openapi()["paths"])
          assert "/internal/jobs/{job_id}/render" in paths
          assert "/internal/jobs/{job_id}/render/preview" in paths
          assert "/internal/jobs/{job_id}/render/download" in paths
          assert "/internal/jobs/{job_id}/render/ack" in paths
          from rendering import render_translated_video, voice_for_language
          assert voice_for_language("uk") == "uk_UA-ukrainian_tts-medium"
          assert voice_for_language("ru")
          assert voice_for_language("bg") == "bg_BG-dimitar-medium"
          assert voice_for_language("lt") == "lt_LT-ingute-medium"
          assert voice_for_language("lv") == "lv_LV-aivars-medium"
          app.Base.metadata.create_all(app.engine)
          source = app.VIDEO_DIR / "ci-render-source.mp4"
          subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
              "-f","lavfi","-i","color=c=black:s=320x240:r=12:d=2",
              "-f","lavfi","-i","sine=frequency=440:sample_rate=22050:duration=2",
              "-shortest","-c:v","libx264","-pix_fmt","yuv420p","-c:a","aac",str(source)],check=True)
          job_id = str(uuid.uuid4())
          with app.SessionLocal() as db:
              user = app.User(username="ci-render",full_name="CI",password_hash="ci",role="user")
              db.add(user); db.flush()
              video = app.Video(id=str(uuid.uuid4()),owner_id=user.id,filename="ci.mp4",
                                stored_name=source.name,size_bytes=source.stat().st_size,visibility="private")
              db.add(video); db.flush()
              job = app.Job(id=job_id,video_id=video.id,owner_id=user.id,status="done",progress=100,
                            source_language="en",target_language="uk",transcript="Hello",
                            translated_text="Привіт",segments_json=json.dumps([
                                {"start":0.1,"end":1.9,"text":"Hello","translated":"Привіт, це перевірка синтезу мовлення."}
                            ],ensure_ascii=False))
              db.add(job); db.commit()
          render_translated_video(job_id)
          with app.SessionLocal() as db:
              output = db.get(app.RenderedOutput,job_id)
              assert output and output.status == "ready", output.error if output else "no output row"
              rendered = Path(output.file_path)
              assert rendered.is_file() and rendered.stat().st_size > 1024
              probe = subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type",
                                               "-of","json",str(rendered)],text=True)
              kinds = {s["codec_type"] for s in json.loads(probe)["streams"]}
              assert {"video","audio"} <= kinds
          # Validate the two less common language models as well; Lithuanian needs the
          # newer upstream phonemizer implementation pinned in requirements.txt.
          import io, os, wave
          from piper import PiperVoice
          from rendering import _download_voice
          voice_dir = Path(os.environ["PIPER_VOICE_DIR"])
          for voice_id, phrase in [
              ("lt_LT-ingute-medium", "Labas rytas, kaip sekasi?"),
              ("lv_LV-aivars-medium", "Labdien, kā jums klājas?")
          ]:
              model = _download_voice(voice_id, voice_dir)
              voice = PiperVoice.load(model, download_dir=voice_dir)
              wav_buffer = io.BytesIO()
              with wave.open(wav_buffer, "wb") as wav_out:
                  voice.synthesize_wav(phrase, wav_out)
              assert len(wav_buffer.getvalue()) > 1024, voice_id
          print("Piper generated speech and FFmpeg produced a playable MP4; LT/LV voices also synthesized.")
          PY
      - name: Check Home Master browser JavaScript
        run: |
          set -euo pipefail
          for f in home-master/web/*.js; do node --check "$f"; done
      - name: Validate locale JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("home-master/web/locales").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Validate two-service Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Ensure no standalone ProntoF UI remains
        run: |
          test ! -e web/index.html
          test ! -e web/app.js
          grep -q 'INTERNAL_ONLY=1' server/Dockerfile
          grep -q 'PRONTOF_API_URL: http://prontof-worker:8000' docker-compose.yml
          grep -q 'ORDER_DATA_DIR: /shared' docker-compose.yml
          grep -q '\${ORDER_SHARED_DATA:-./data/shared}:/shared' docker-compose.yml
          grep -q '/internal/jobs/{job_id}/retranslate' server/app.py
          grep -q '/internal/orders/{order_id}/videos/import' server/app.py
